<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="余烬 EMBERS">
  <!-- 站点图标：纸底 + 一枚朱印。
       2026-11 之前这里是「暗底 + 橙色钢琴键」（#ff5a1f），
       和站内的纸墨 / 朱红是两套完全不同的语言，缩小到 16px 只剩一个橙点。
       现在与 app/apple-icon.png、icon-192/512 同一套构图：米白纸、朱印、纸白的「余」。 -->
  <rect width="64" height="64" rx="13" fill="#F2ECE1"/>
  <rect x="9" y="9" width="46" height="46" rx="6" fill="#9E3B2E"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Songti SC, SimSun, STSong, serif" font-size="29"
        font-weight="700" fill="#F2ECE1">余</text>
</svg>
